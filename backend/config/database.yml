# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
# When DATABASE_URL is set (e.g., Render, Railway, Neon), PostgreSQL is used.
production:
  primary: &primary_production
    <% if ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    <% else %>
    <<: *default
    database: storage/production.sqlite3
    <% end %>
  cache:
    <% if ENV["SOLID_CACHE_DATABASE_URL"].present? || ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    url: <%= ENV["SOLID_CACHE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    migrations_paths: db/cache_migrate
    <% else %>
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
    <% end %>
  queue:
    <% if ENV["SOLID_QUEUE_DATABASE_URL"].present? || ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    url: <%= ENV["SOLID_QUEUE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    migrations_paths: db/queue_migrate
    <% else %>
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
    <% end %>
  cable:
    <% if ENV["SOLID_CABLE_DATABASE_URL"].present? || ENV["DATABASE_URL"].present? %>
    adapter: postgresql
    url: <%= ENV["SOLID_CABLE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    migrations_paths: db/cable_migrate
    <% else %>
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
    <% end %>
